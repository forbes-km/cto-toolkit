<svg width="680" height="340" viewBox="0 0 680 340" xmlns="http://www.w3.org/2000/svg" role="img">
<title>How the diligence and technical debt tools connect</title>
<desc>Two parallel pipelines: a diligence pipeline running from the Technology DD Scoring Workbook through the Diligence Prioritization Engine to a 100-Day Plan, and a technical debt pipeline running from the APM Simulator through the Carry Cost Optimizer to a Multi-Year Plan.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#52564F" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<rect width="680" height="340" fill="#FDFDFC"/>

<text x="50" y="30" font-family="ui-sans-serif, sans-serif" font-size="12" fill="#52564F">Diligence pipeline</text>
<g>
  <rect x="50" y="42" width="180" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="140" y="60" text-anchor="middle" font-family="ui-sans-serif, sans-serif" font-size="14" font-weight="600" fill="#085041">DD Scoring Workbook</text>
  <text x="140" y="78" text-anchor="middle" font-family="ui-sans-serif, sans-serif" font-size="12" fill="#0F6E56">Domain + red-flag scoring</text>
</g>
<line x1="230" y1="70" x2="248" y2="70" stroke="#52564F" stroke-width="1" marker-end="url(#arrow)"/>
<g>
  <rect x="250" y="42" width="180" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="340" y="60" text-anchor="middle" font-family="ui-sans-serif, sans-serif" font-size="14" font-weight="600" fill="#085041">Prioritization Engine</text>
  <text x="340" y="78" text-anchor="middle" font-family="ui-sans-serif, sans-serif" font-size="12" fill="#0F6E56">Sequences remediation items</text>
</g>
<line x1="430" y1="70" x2="448" y2="70" stroke="#52564F" stroke-width="1" marker-end="url(#arrow)"/>
<g>
  <rect x="450" y="42" width="180" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="540" y="60" text-anchor="middle" font-family="ui-sans-serif, sans-serif" font-size="14" font-weight="600" fill="#085041">100-Day Plan</text>
  <text x="540" y="78" text-anchor="middle" font-family="ui-sans-serif, sans-serif" font-size="12" fill="#0F6E56">Phased execution roadmap</text>
</g>

<text x="50" y="185" font-family="ui-sans-serif, sans-serif" font-size="12" fill="#52564F">Technical debt pipeline</text>
<g>
  <rect x="50" y="197" width="180" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
  <text x="140" y="215" text-anchor="middle" font-family="ui-sans-serif, sans-serif" font-size="14" font-weight="600" fill="#712B13">APM Simulator</text>
  <text x="140" y="233" text-anchor="middle" font-family="ui-sans-serif, sans-serif" font-size="12" fill="#993C1D">Debt score + portfolio risk</text>
</g>
<line x1="230" y1="225" x2="248" y2="225" stroke="#52564F" stroke-width="1" marker-end="url(#arrow)"/>
<g>
  <rect x="250" y="197" width="180" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
  <text x="340" y="215" text-anchor="middle" font-family="ui-sans-serif, sans-serif" font-size="14" font-weight="600" fill="#712B13">Carry Cost Optimizer</text>
  <text x="340" y="233" text-anchor="middle" font-family="ui-sans-serif, sans-serif" font-size="12" fill="#993C1D">Multi-year budget sequencing</text>
</g>
<line x1="430" y1="225" x2="448" y2="225" stroke="#52564F" stroke-width="1" marker-end="url(#arrow)"/>
<g>
  <rect x="450" y="197" width="180" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
  <text x="540" y="215" text-anchor="middle" font-family="ui-sans-serif, sans-serif" font-size="14" font-weight="600" fill="#712B13">Multi-Year Plan</text>
  <text x="540" y="233" text-anchor="middle" font-family="ui-sans-serif, sans-serif" font-size="12" fill="#993C1D">Budget-constrained roadmap</text>
</g>

<text x="50" y="300" font-family="ui-sans-serif, sans-serif" font-size="12" fill="#52564F">Both pipelines take a populated scoring workbook as input and produce a sequenced, rationale-backed plan as output.</text>
</svg>
